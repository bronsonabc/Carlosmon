  .btn{background:#2c2c38;border:2px solid #4a4a5c;border-radius:10px;color:#e8e8f0;font:bold 16px ui-monospace,monospace;

  .btn.on{background:#5a5a78}
  .ab{display:flex;gap:12px;align-items:center}
  .round{width:64px;height:64px;border-radius:50%}
  .small{width:64px;height:34px;font-size:11px}

const nm=m=>SPECIES[m.sp].name;
function stat(m,k){
  const b=SPECIES[m.sp].base[k];
  return k==='hp' ? Math.floor(b*2*m.lvl/100)+m.lvl+10 : Math.floor(b*2*m.lvl/100)+5;
}
function makeMon(sp,lvl){
  const m={sp,lvl,exp:lvl**3,moves:[]};
  for(const [l,mvn] of SPECIES[sp].moves) if(l<=lvl) m.moves.push(mvn);
  m.moves=m.moves.slice(-4);
  m.hp=stat(m,'hp');
  return m;
}
function healAll(){ G.party.forEach(m=>m.hp=stat(m,'hp')); }
function typeMult(a,d){ if(TYPES[a].beats===d) return 2; if(TYPES[d].beats===a) return .5; return 1; }
function wildMon(){
  const tb=G.map==='north'?ROUTE2:ROUTE1;
  let r=Math.random()*tb.reduce((s,e)=>s+e[1],0);
  for(const [sp,w,lo,hi] of tb){ if((r-=w)<0) return makeMon(sp,lo+rnd(hi-lo+1)); }
  return makeMon('late',3);
}

const FONT='bold 9px ui-monospace,Menlo,Consolas,monospace';
function paginate(text){
  ctx.font=FONT;
  const lines=[]; let cur='';
  for(const word of String(text).split(' ')){
    const t=cur?cur+' '+word:word;
    if(ctx.measureText(t).width>220/1 && cur){ lines.push(cur); cur=word; } else cur=t;
  }
  if(cur) lines.push(cur);
  const pages=[]; for(let i=0;i<lines.length;i+=3) pages.push(lines.slice(i,i+3));
  return pages.length?pages:[['']];
}
function say(text){ return new Promise(res=>{ ui.text={pages:paginate(text),page:0,n:0,res,wait:true}; }); }
function setText(text){ ui.text={pages:paginate(text),page:0,n:999,res:null,wait:false}; }
function menu(opts,o={}){
  return new Promise(res=>{ ui.menus.push({opts,sel:o.sel||0,x:o.x,y:o.y,w:o.w||64,cancel:o.cancel!==false,res}); });
}
async function yesNo(q){ setText(q); return (await menu(['YES','NO']))===0; }
async function pickMon(title){
  setText(title);
  return menu(G.party.map(partyLabel),{x:8,y:6,w:224});
}
async function script(fn){
  if(busy) return;
  busy=true;
  try{ await fn(); }catch(e){ console.error(e); }
  finally{ busy=false; ui.text=null; ui.menus.length=0; }
}
async function fadeTo(v){
  const from=fx.a;
  for(let i=1;i<=8;i++){ fx.a=from+(v-from)*i/8; await sleep(22); }
}

const KEYMAP={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right',w:'up',s:'down',a:'left',d:'right',
  z:'A',' ':'A',enter:'A',x:'B',escape:'B',backspace:'B',m:'START'};
window.addEventListener('keydown',e=>{
  const b=KEYMAP[e.key.toLowerCase()]; if(!b) return;
  e.preventDefault(); if(e.repeat) return; held[b]=true; onPress(b);
});
window.addEventListener('keyup',e=>{ const b=KEYMAP[e.key.toLowerCase()]; if(b) held[b]=false; });
window.addEventListener('blur',()=>{ for(const k in held) held[k]=false; });
document.querySelectorAll('[data-btn]').forEach(el=>{
  const b=el.dataset.btn;
  const down=e=>{ e.preventDefault(); held[b]=true; el.classList.add('on'); onPress(b); };
  const up=e=>{ e.preventDefault(); held[b]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up);
  el.addEventListener('pointerleave',up); el.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});

function onPress(b){
  const mn=ui.menus[ui.menus.length-1];
  if(mn){
    if(b==='up') mn.sel=(mn.sel+mn.opts.length-1)%mn.opts.length;
    else if(b==='down') mn.sel=(mn.sel+1)%mn.opts.length;
    else if(b==='A'){ ui.menus.pop(); mn.res(mn.sel); }
    else if(b==='B'&&mn.cancel){ ui.menus.pop(); mn.res(-1); }
    return;
  }
  const t=ui.text;
  if(t&&t.wait){
    if(b!=='A'&&b!=='B') return;
    const len=t.pages[t.page].join('').length;
    if(t.n<len) t.n=999;
    else if(t.page<t.pages.length-1){ t.page++; t.n=0; }
    else { t.wait=false; const r=t.res; t.res=null; r(); }
    return;
  }
  if(busy) return;
  if(scene==='title'){ if(b==='A'||b==='START') script(titleMenu); return; }
  if(scene==='world'&&!mv){
    if(b==='A') interact();
    else if(b==='START') script(startMenu);
  }
}

function canWalk(map,x,y){
  const m=MAPS[map]; if(y<0||y>=m.rows.length||x<0||x>=m.rows[0].length) return false;
  return !SOLID.has(m.rows[y][x]) && !entityAt(map,x,y);
}
function tryMove(dir){
  G.dir=dir; const [dx,dy]=DIRS[dir];
  if(canWalk(G.map,G.x+dx,G.y+dy)) mv={dx,dy,t:0};
}
function showBanner(){ const n=areaName(); if(n!==banner.text){ banner.text=n; banner.t=130; } }
async function warpTo(w){
  await fadeTo(1);
  if(!MAPS[w.map].outside) G.ret={map:G.map,x:G.x,y:G.y+1,dir:'down'};
  G.map=w.map; G.x=w.x; G.y=w.y; G.dir=w.dir;
  showBanner();
  await fadeTo(0);
}
function arrive(){
  const w=WARPS[G.map+':'+G.x+','+G.y];
  if(w){ script(()=>warpTo(w)); return; }
  const t=tileAt(G.map,G.x,G.y);
  if(t==='M'){ script(()=>warpTo(G.ret||EXITS[G.map])); return; }
  showBanner();
  if(checkTrainers()) return;
  if(t===':'&&G.party.length&&Math.random()<.13){
    script(async()=>{ const r=await battle({wild:true,party:[wildMon()]}); if(r==='lose') await blackout(); });
  }
}
function checkTrainers(){
  for(const e of ENT){
    if(e.map!==G.map||!e.trainer||e.trainer.noSight||G.beaten[e.id]) continue;
    const [dx,dy]=DIRS[e.dir];
    for(let i=1;i<=4;i++){
      const x=e.x+dx*i,y=e.y+dy*i;
      if(x===G.x&&y===G.y){ script(()=>trainerBattle(e,true)); return true; }
      if(SOLID.has(tileAt(e.map,x,y))) break;
    }
  }
  return false;
}
async function trainerBattle(e,spotted){
  if(spotted){ e.alert=frame+45; await sleep(700); }
  const tr=e.trainer;
  await say(tr.intro);
  const r=await battle({name:tr.name,party:tr.party.map(([sp,l])=>makeMon(sp,l)),prize:tr.prize});
  if(r==='win'){ G.beaten[e.id]=true; await say(tr.outro); if(tr.onWin) await tr.onWin(); }
  else await blackout();
}
async function blackout(){
  await fadeTo(1);

  healAll(); banner.text='';

  await say('You hurried back to safety. Your Carloses are rested and ready to go again!');
}

      if(!G.box.length){ await say('There are no Carloses in storage.'); continue; }
      if(G.party.length>=6){ await say('Your party is full. Deposit a Carlos first.'); continue; }
      setText('Withdraw which Carlos?');
      const i=await menu(G.box.slice(0,9).map(partyLabel),{x:8,y:6,w:224});
      if(i>=0){ const m=G.box.splice(i,1)[0]; m.hp=stat(m,'hp'); G.party.push(m); await say(`${nm(m)} joined your party!`); }
    } else if(c===1){
      if(G.party.length<=1){ await say("You can't deposit your last Carlos!"); continue; }
      const i=await pickMon('Deposit which Carlos?');
      if(i>=0){ const m=G.party.splice(i,1)[0]; G.box.push(m); await say(`${nm(m)} was sent to storage.`); }
    } else break;
  }
}
async function useCola(m){
  if(m.hp<=0){ await say(`${nm(m)} has fainted. Cola can't fix that.`); return false; }
  if(m.hp>=stat(m,'hp')){ await say(`${nm(m)} is already at full HP.`); return false; }
  G.bag.cola--; m.hp=Math.min(stat(m,'hp'),m.hp+COLA_HEAL);
  await say(`${nm(m)} chugged the CARLOS COLA and recovered HP!`);
  return true;
}

// ------------------------------ BATTLE --------------------------------
const stageMult=s=>s>=0?(2+s)/2:2/(2-s);
const label=who=>who==='me'?nm(B.me):(B.wild?'Wild ':'Foe ')+nm(B.foe);

async function battle(o){
  for(let i=0;i<3;i++){ fx.a=.9; await sleep(70); fx.a=0; await sleep(70); }
  await fadeTo(1);
  const foes=o.party; let fi=0, result;
  B={foe:foes[0],me:G.party.find(m=>m.hp>0),wild:!!o.wild,name:o.name,showFoe:!!o.wild,showMe:false,
     st:{me:{atk:0,def:0},foe:{atk:0,def:0}},hpS:{},hit:{},ball:null};
  B.hpS.me=B.me.hp; B.hpS.foe=B.foe.hp;
  scene='battle'; ui.text=null;
  await fadeTo(0);
  if(o.wild) await say(`A wild ${nm(B.foe)} appeared!`);
  else { await say(`${o.name} wants to battle!`); B.showFoe=true; await say(`${o.name} sent out ${nm(B.foe)}!`); }
  B.showMe=true; await say(`Go! ${nm(B.me)}!`);

  while(true){
    // ---- choose an action
    let act=null;
    while(!act){
      setText(`What will ${nm(B.me)} do?`);
      const c=await menu(['FIGHT','BAG','CARLOSES','RUN'],{cancel:false,w:70});
      if(c===0){
        const ms=B.me.moves;
        const i=await menu(ms.map(n=>n.padEnd(18)+MOVES[n].type),{w:164});
        if(i>=0) act={t:'move',mv:ms[i]};
      } else if(c===1){
        const i=await menu([`CARLOSBALL x${G.bag.ball}`,`CARLOS COLA x${G.bag.cola}`],{w:108});
        if(i===0){
          if(!o.wild) await say("You can't catch someone else's Carlos! That's just rude.");
          else if(!G.bag.ball) await say('You have no CARLOSBALLS! The CARLOSMART in CARLOS CITY sells them.');
          else act={t:'ball'};
        } else if(i===1){
          if(!G.bag.cola) await say('You have no CARLOS COLA.');
          else if(await useCola(B.me)) act={t:'item'};
        }
      } else if(c===2){
        const i=await pickMon('Switch to which Carlos?');
        if(i>=0){
          if(G.party[i]===B.me) await say(`${nm(B.me)} is already out there!`);
          else if(G.party[i].hp<=0) await say(`${nm(G.party[i])} has no energy left!`);
          else act={t:'switch',i};
        }
      } else {
        if(!o.wild) await say("There's no running from a Carlos battle!");
        else act={t:'run'};
      }
    }
    // ---- your non-attack actions happen first
    if(act.t==='run'){
      if(Math.random()<.9){ await say('Got away safely!'); result='run'; break; }
      await say("Couldn't get away!");
    } else if(act.t==='switch'){
      await say(`${nm(B.me)}, come back!`);
      B.me=G.party[act.i]; B.st.me={atk:0,def:0}; B.hpS.me=B.me.hp;
      await say(`Go! ${nm(B.me)}!`);
    } else if(act.t==='ball'){
      if(await throwBall()){ result='caught'; break; }
    }
    // ---- attacks, fastest first
    const foeMove=pick(B.foe.moves);
    const order=act.t!=='move'?['foe']:(stat(B.me,'spd')>=stat(B.foe,'spd')?['me','foe']:['foe','me']);
    for(const who of order){
      if(B.me.hp<=0||B.foe.hp<=0) break;
      await useMove(who,who==='me'?act.mv:foeMove);
    }
    // ---- faints
    if(B.foe.hp<=0){
      await say(`${label('foe')} fainted!`); B.showFoe=false;
      await gainExp(B.me,Math.floor(SPECIES[B.foe.sp].exp*B.foe.lvl/7*(o.wild?1:1.5)));
      if(++fi<foes.length){
        B.foe=foes[fi]; B.st.foe={atk:0,def:0}; B.hpS.foe=B.foe.hp; B.showFoe=true;
        await say(`${o.name} sent out ${nm(B.foe)}!`);
        continue;
      }
      result='win'; break;
    }
    if(B.me.hp<=0){
      await say(`${nm(B.me)} fainted!`);
      if(!G.party.some(m=>m.hp>0)){ result='lose'; break; }
      let i=-1;
      while(i<0||G.party[i].hp<=0) i=await pickMon('Send out which Carlos?');
      B.me=G.party[i]; B.st.me={atk:0,def:0}; B.hpS.me=B.me.hp;
      await say(`Go! ${nm(B.me)}!`);
    }
  }
  if(result==='win'&&!o.wild){
    await say(`You defeated ${o.name}!`);
    G.money+=o.prize; await say(`You got $${o.prize} for winning!`);
  }
  if(result==='lose') await say("You're out of Carloses that can battle!");
  await fadeTo(1);
  scene='world'; B=null; ui.text=null;
  await fadeTo(0);
  return result;
}

async function useMove(who,name){
  const me=who==='me', A=me?B.me:B.foe, D=me?B.foe:B.me, dk=me?'foe':'me';
  const m=MOVES[name];
  await say(`${label(who)} used ${name.toUpperCase()}!`);
  if(Math.random()*100>=(m.acc||100)){ await say('But it missed!'); return; }
  if(m.kind==='heal'){
    const max=stat(A,'hp');
    if(A.hp>=max){ await say('But nothing happened!'); return; }
    A.hp=Math.min(max,A.hp+Math.ceil(max/2)); await sleep(500);
    await say(`${label(who)} feels refreshed!`);
  } else if(m.kind==='atkDown'||m.kind==='defDown'){
    const k=m.kind==='atkDown'?'atk':'def';
    if(m.flavor) await say(m.flavor);
    if(B.st[dk][k]<=-6){ await say('But nothing happened!'); return; }
    B.st[dk][k]--;
    await say(`${label(dk)}'s ${k==='atk'?'ATTACK':'DEFENSE'} fell!`);
  } else {
    const eff=typeMult(m.type,SPECIES[D.sp].type);
    const crit=Math.random()<.06?1.5:1;
    const stab=m.type===SPECIES[A.sp].type?1.5:1;
    const atk=stat(A,'atk')*stageMult(B.st[who].atk), def=stat(D,'def')*stageMult(B.st[dk].def);
    let dmg=Math.floor(((2*A.lvl/5+2)*m.power*atk/def)/50+2);
    dmg=Math.max(1,Math.floor(dmg*eff*crit*stab*(.85+Math.random()*.15)));
    D.hp=Math.max(0,D.hp-dmg);
    B.hit[dk]=frame+30;
    await sleep(650);
    if(m.flavor) await say(m.flavor);
    if(crit>1) await say('A critical hit!');
    if(eff>1) await say("It's super effective!");
    if(eff<1) await say("It's not very effective...");
  }
}

async function gainExp(m,amount){
  m.exp+=amount;
  await say(`${nm(m)} gained ${amount} EXP!`);
  while(m.exp>=(m.lvl+1)**3 && m.lvl<100){
    const old=stat(m,'hp'); m.lvl++; m.hp+=stat(m,'hp')-old;
    await say(`${nm(m)} grew to level ${m.lvl}!`);
    for(const [l,mvn] of SPECIES[m.sp].moves){
      if(l===m.lvl&&!m.moves.includes(mvn)){
        if(m.moves.length>=4) m.moves.shift();
        m.moves.push(mvn);
        await say(`${nm(m)} learned ${mvn.toUpperCase()}!`);
      }
    }
  }
  const ev=SPECIES[m.sp].evolve;
  if(ev&&m.lvl>=ev[0]){
    const before=nm(m), old=stat(m,'hp');
    await say(`What? ${before} is having a GLOW-UP!`);
    if(B){ B.hit.me=frame+70; } await sleep(1200);
    m.sp=ev[1]; m.hp+=stat(m,'hp')-old;
    await say(`${before} became ${nm(m)}!`);
  }
}

async function throwBall(){
  const f=B.foe, s=SPECIES[f.sp];
  G.bag.ball--;
  await say('You threw a CARLOSBALL!');
  B.showFoe=false; B.ball={shake:false};
  const p=Math.min(.97,s.catch*(3-2*f.hp/stat(f,'hp')));
  const per=Math.cbrt(p);
  let ok=true;
  for(let i=0;i<3;i++){
    await sleep(350); B.ball.shake=true; await sleep(450); B.ball.shake=false;
    if(Math.random()>per){ ok=false; break; }
  }
  if(!ok){
    B.ball=null; B.showFoe=true;
    await say(pick(['Argh! It broke free!','So close! The Carlos escaped!','Nope! It popped right out!']));
    return false;
  }
  await sleep(300);
  await say(`Gotcha! ${s.name} was caught!`);
  if(G.party.length<6) G.party.push(f);
  else { G.box.push(f); await say(`Your party is full, so ${s.name} was sent to Professor Carlos's lab.`); }
  B.ball=null;
  return true;
}

const R=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };

// Draws a Carlos on a 16x16 grid, each cell k pixels. Used for people AND monsters.
function drawCarlos(ox,oy,k,look,dir,step,flip){
  look=look||{}; dir=dir||'down';
  const skin=look.skin||'#e2ac7c', hair=look.hair||'#6b4226', shirt=look.shirt||'#4a78c8', pants=look.pants||'#35405c';
  const p=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(ox+(flip?16-x-w:x)*k,oy+y*k,w*k,h*k); };
  const l1=step===1?1:0, l2=step===2?1:0;
  p(5,13,2,2-l1,pants); p(9,13,2,2-l2,pants); p(5,15-l1,2,1,'#20202a'); p(9,15-l2,2,1,'#20202a');
  p(4,8,8,5,shirt); p(3,8,1,4,shirt); p(12,8,1,4,shirt); p(3,12,1,1,skin); p(12,12,1,1,skin);
  if(look.wide){ p(2,8,1,4,shirt); p(13,8,1,4,shirt); }
  if(look.sleeveless){ p(3,8,1,4,skin); p(12,8,1,4,skin); p(2,8,1,3,skin); p(13,8,1,3,skin); }
  if(look.robe){ p(4,8,8,7,shirt); p(7,8,2,7,'#ffffff'); }
  if(look.bib&&dir!=='up'){ p(6,8,4,3,'#ffffff'); }
  if(look.coat){ p(4,8,3,5,'#f4f4f4'); p(9,8,3,5,'#f4f4f4'); p(3,8,1,4,'#f4f4f4'); p(12,8,1,4,'#f4f4f4'); }
  if(look.apron) p(5,9,6,4,'#ffffff');
  if(look.tie&&dir!=='up') p(7,8,2,4,'#b03030');
  const shade='#c48a5c';
  p(4,2,8,4,skin); p(5,6,6,1,skin); p(6,7,4,1,skin); p(7,8,2,1,skin);
  if(dir==='up'){ p(3,1,10,6,hair); if(look.longHair) p(3,7,10,3,hair); }
  else {
    p(4,1,8,2,hair); p(3,2,1,3,hair); p(12,2,1,3,hair); p(4,0,6,1,hair); p(10,1,2,1,'#855634');
    p(4,5,1,1,shade); p(11,5,1,1,shade); p(5,6,1,1,shade); p(10,6,1,1,shade);
    if(look.longHair){ p(3,2,1,8,hair); p(12,2,1,8,hair); }
    if(look.spiky){ p(4,0,1,1,hair); p(6,0,2,1,hair); p(9,0,1,1,hair); p(11,0,1,1,hair); }
    const ex=dir==='left'?-1:dir==='right'?1:0;
    if(look.shades) p(5+ex,4,6,2,'#15151a');
    else if(look.eyes==='sleepy'){ p(5+ex,5,2,1,'#15151a'); p(9+ex,5,2,1,'#15151a'); }
    else { p(6+ex,5,1,1,'#15151a'); p(9+ex,5,1,1,'#15151a'); }
    if(look.glasses){ p(5+ex,4,3,1,'#555'); p(8+ex,4,3,1,'#555'); }
    if(!look.shades&&!look.glasses){ p(5+ex,4,2,1,'#3d2414'); p(9+ex,4,2,1,'#3d2414'); }
    if((look.mouth||'flat')!=='open') p(8+ex,6,1,1,shade);
    const mo=look.mouth||'flat';
    if(mo==='smile'){ p(7+ex,7,2,1,'#8a3b2a'); }
    else if(mo==='open'){ p(7+ex,6,2,2,'#5a1a1a'); }
    else if(mo==='frown'){ p(7+ex,7,2,1,'#5a1a1a'); p(6+ex,6,1,1,'#8a3b2a'); }
    else p(7+ex,7,2,1,'#a8674a');
  }
  const hc=look.hatColor||'#d83a3a';
  if(look.hat==='cap'){ p(4,0,8,3,hc); p(3,1,1,2,hc); p(12,1,1,2,hc); if(dir!=='up') p(dir==='right'?8:3,3,6,1,hc); }
  else if(look.hat==='headband'){ p(3,3,10,1,hc); }
  else if(look.hat==='nightcap'){ p(4,0,8,3,hc); p(12,1,2,1,hc); p(13,2,1,2,hc); p(13,4,1,1,'#ffffff'); }
  else if(look.hat==='headset'){ p(4,0,8,1,'#333'); p(3,1,1,5,'#333'); p(12,1,1,5,'#333'); if(dir!=='up') p(10,7,3,1,'#333'); }
  if(dir==='down'){
    switch(look.item){
      case 'dumbbell': p(13,11,3,1,'#999'); p(13,10,1,3,'#333'); p(15,10,1,3,'#333'); break;
      case 'pillow':   p(0,9,4,4,'#ffffff'); p(0,12,4,1,'#c9d2e8'); break;
      case 'chips':    p(13,9,3,4,'#f2c230'); p(13,10,3,1,'#d8402f'); break;

      case 'controller': p(5,10,6,2,'#2c2c34'); p(6,10,1,1,'#e33'); p(9,10,1,1,'#3d3'); break;
      case 'coffee':   p(13,10,2,3,'#ffffff'); p(13,10,2,1,'#6b4a2b'); p(15,11,1,1,'#ffffff'); break;
      case 'mic':      p(13,9,1,4,'#888'); p(12,7,3,2,'#222'); break;
      case 'mug':      p(13,10,2,3,'#d8402f'); p(15,11,1,1,'#d8402f'); break;

      case 'taco':     p(13,10,3,2,'#f2c230'); p(13,9,3,1,'#6aa84f'); p(14,9,1,1,'#d8402f'); break;
      case 'fork':     p(14,6,1,7,'#b8b8b8'); p(13,6,3,1,'#b8b8b8'); p(13,7,1,1,'#b8b8b8'); p(15,7,1,1,'#b8b8b8'); break;
    }
  }
}

    case 'W': wall(); break;
    case 'w': wall(); R(sx+3,sy+3,10,8,'#5a4a3a'); R(sx+4,sy+4,8,6,'#9fd4f0'); R(sx+7,sy+4,1,6,'#5a4a3a'); break;
    case 'D': case 'd': wall(); R(sx+2,sy+1,12,15,'#5a3a22'); R(sx+3,sy+2,10,14,ch==='D'?'#8c5a30':'#74502e'); R(sx+10,sy+9,2,2,'#f2c230'); break;
    case '_': floor(); break;
    case 'X': R(sx,sy,T,T,'#8f8478'); R(sx,sy+12,T,4,'#6f655b'); R(sx,sy,T,2,'#aca196'); break;
    case 'T': floor(); R(sx,sy+2,T,10,'#8c5a30'); R(sx,sy+2,T,2,'#b07a48'); R(sx+1,sy+12,2,4,'#5a3a22'); R(sx+13,sy+12,2,4,'#5a3a22'); break;
    case 'B': floor(); R(sx+1,sy,14,16,'#3558a8'); R(sx+2,sy+1,12,5,'#ffffff'); R(sx+2,sy+7,12,8,'#5a86d8'); break;
    case 'C': floor(); R(sx,sy+1,T,13,'#2a7f78'); R(sx,sy+1,T,4,'#58c2b8'); break;
    case 'K': R(sx,sy,T,T,'#6b4a2b'); R(sx+1,sy+2,14,5,'#3a2a1a'); R(sx+1,sy+9,14,5,'#3a2a1a');
              ['#d8553f','#4a78c8','#e0a52e','#6aa84f'].forEach((c,i)=>{ R(sx+2+i*3,sy+3,2,4,c); R(sx+3+i*3,sy+10,2,4,c); }); break;
    case 'M': R(sx,sy,T,T,'#8f8478'); R(sx,sy,T,12,'#c0483a'); R(sx+2,sy+2,12,8,'#e06a5a'); break;
    case 'H': R(sx,sy,T,T,'#8f8478'); R(sx+1,sy+2,14,13,'#d8dde6'); R(sx+3,sy+4,10,5,'#58c2b8'); R(sx+4,sy+11,2,2,'#e2553a'); R(sx+8,sy+11,2,2,'#6aa84f'); break;
    case 'p': floor(); R(sx+5,sy+10,6,5,'#b5623a'); R(sx+4,sy+2,8,8,'#3f8f4a'); R(sx+6,sy,4,4,'#62b866'); break;
    default: R(sx,sy,T,T,'#000');
  }
}

function drawWorld(){
  const m=MAPS[G.map], mw=m.rows[0].length*T, mh=m.rows.length*T;
  const px=(G.x+(mv?mv.dx*mv.t:0))*T, py=(G.y+(mv?mv.dy*mv.t:0))*T;
  let cx=Math.round(px-7*T), cy=Math.round(py-5*T);
  cx=mw<=W?-(W-mw)/2:Math.max(0,Math.min(mw-W,cx));
  cy=mh<=H?-(H-mh)/2:Math.max(0,Math.min(mh-H,cy));
  cx=Math.round(cx); cy=Math.round(cy);
  R(0,0,W,H,'#101014');
  const x0=Math.max(0,Math.floor(cx/T)), y0=Math.max(0,Math.floor(cy/T));
  for(let ty=y0;ty<Math.min(m.rows.length,y0+VH+1);ty++)
    for(let tx=x0;tx<Math.min(m.rows[0].length,x0+VW+1);tx++)
      drawTile(m.rows[ty][tx],tx*T-cx,ty*T-cy,tx,ty,G.map);
  if(MAPS[G.map].outside){
    ctx.font='bold 7px ui-monospace,Menlo,Consolas,monospace'; ctx.textAlign='center';
    for(const l of LABELS){ if(l.map!==G.map) continue; ctx.fillStyle='#ffffff'; ctx.fillText(l.text,(l.x+l.w/2)*T-cx,l.y*T-cy+10); }
    ctx.textAlign='left';
  }
  const list=ENT.filter(e=>e.map===G.map&&visible(e)).map(e=>({y:e.y*T,e}));
  list.push({y:py,player:true});
  list.sort((a,b)=>a.y-b.y);
  for(const it of list){
    if(it.player){
      const step=mv?(mv.t<.5?1:2):0;
      drawCarlos(Math.round(px)-cx,Math.round(py)-cy-3,1,LOOKS.player,G.dir,step);
    } else {
      const e=it.e, sx=e.x*T-cx, sy=e.y*T-cy;
      if(e.kind==='ball') drawBall(sx+4,sy+2,1);
      else {
        drawCarlos(sx,sy-3,1,e.look,e.dir,0);
        if(e.alert>frame){ R(sx+5,sy-16,6,11,'#ffffff'); R(sx+7,sy-14,2,5,'#d8402f'); R(sx+7,sy-8,2,2,'#d8402f'); }
      }
    }
  }
  if(banner.t>0&&!ui.text){
    ctx.font=FONT; const w=ctx.measureText(banner.text).width+12;
    R(4,4,w,16,'#20202a'); R(5,5,w-2,14,'#f8f4e4'); ctx.fillStyle='#20202a'; ctx.fillText(banner.text,10,15);
  }
}

function hpBar(x,y,w,cur,max){
  const f=Math.max(0,Math.min(1,cur/max));
  R(x,y,w,5,'#20202a'); R(x+1,y+1,w-2,3,'#585868');
  R(x+1,y+1,Math.round((w-2)*f),3,f>.5?'#4ec24a':f>.2?'#e8c020':'#e04a3a');
}
function infoBox(x,y,m,shown,mine){
  R(x,y,108,mine?34:26,'#20202a'); R(x+1,y+1,106,mine?32:24,'#f8f4e4');
  ctx.font=FONT; ctx.fillStyle='#20202a';
  ctx.fillText(nm(m),x+5,y+11);
  ctx.textAlign='right'; ctx.fillText('L'+m.lvl,x+103,y+11); ctx.textAlign='left';
  R(x+5,y+15,22,6,TYPES[SPECIES[m.sp].type].color);
  hpBar(x+30,y+15,73,shown,stat(m,'hp'));
  if(mine){
    ctx.fillText(Math.ceil(shown)+'/'+stat(m,'hp'),x+5,y+30);
    const a=m.lvl**3, b=(m.lvl+1)**3;
    R(x+52,y+26,51,3,'#b8b4a4'); R(x+52,y+26,Math.round(51*Math.min(1,(m.exp-a)/(b-a))),3,'#4a8fd8');
  }
}
function drawBattle(){
  R(0,0,W,H,'#eef0e0'); R(0,0,W,40,'#d6ecf5'); R(0,40,W,2,'#c2dbe4');
  ctx.fillStyle='#b9d49a';
  ctx.beginPath(); ctx.ellipse(182,66,42,10,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(56,124,54,11,0,0,Math.PI*2); ctx.fill();
  const blink=who=>B.hit[who]>frame&&(frame>>2)%2;
  if(B.showFoe&&!blink('foe')) drawCarlos(158,18,3,SPECIES[B.foe.sp].look,'down',0);
  if(B.ball) drawBall(170+(B.ball.shake?Math.round(Math.sin(frame*.6)*3):0),44,3);
  if(B.showMe&&!blink('me')) drawCarlos(24,60,4,SPECIES[B.me.sp].look,'down',0,true);
  if(B.showFoe||B.ball) infoBox(8,10,B.foe,B.hpS.foe,false);
  if(B.showMe) infoBox(124,74,B.me,B.hpS.me,true);
}
function drawTitle(){
  R(0,0,W,H,'#2a2440');
  for(let i=0;i<24;i++) R((i*37+frame/4)%W,(i*53)%110,1,1,'#ffffff');
  ctx.textAlign='center';
  ctx.font='bold 34px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle='#15151a'; ctx.fillText('CARLOS',W/2+2,50);
  ctx.fillStyle='#f2c230'; ctx.fillText('CARLOS',W/2,48);
  ctx.font='bold 10px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillStyle='#ffffff'; ctx.fillText('C A R L O S   V E R S I O N',W/2,64);
  ctx.textAlign='left';
  drawCarlos(40,76,3,SPECIES.gym.look,'down',0);
  drawCarlos(96,72+Math.round(Math.sin(frame/20)*2),3,LOOKS.player,'down',0);
  drawCarlos(152,76,3,SPECIES.nap.look,'down',0,true);
  if(!ui.menus.length&&(frame>>5)%2){
    ctx.font=FONT; ctx.textAlign='center'; ctx.fillStyle='#ffffff';
    ctx.fillText('PRESS  A  (Z / SPACE)  TO START',W/2,150); ctx.textAlign='left';
  }
  ctx.font='7px ui-monospace,Menlo,Consolas,monospace'; ctx.fillStyle='#8a84a8'; ctx.textAlign='center';
  ctx.fillText('Gotta Carlos them all.',W/2,168); ctx.textAlign='left';
}
function drawBox(x,y,w,h){ R(x,y,w,h,'#20202a'); R(x+1,y+1,w-2,h-2,'#f8f4e4'); R(x+3,y+3,w-6,h-6,'#20202a'); R(x+4,y+4,w-8,h-8,'#f8f4e4'); }
function drawUI(){
  const t=ui.text;
  if(t){
    drawBox(0,128,W,48);
    ctx.font=FONT; ctx.fillStyle='#20202a';
    let left=Math.floor(t.n);
    const lines=t.pages[t.page];
    lines.forEach((ln,i)=>{ const s=ln.slice(0,Math.max(0,left)); left-=ln.length; ctx.fillText(s,10,143+i*12); });
    if(t.wait&&t.n>=lines.join('').length&&(frame>>4)%2){
      ctx.beginPath(); ctx.moveTo(224,166); ctx.lineTo(232,166); ctx.lineTo(228,171); ctx.fill();
    }
  }
  for(const mn of ui.menus){
    const h=mn.opts.length*12+12;
    const x=mn.x!==undefined?mn.x:W-mn.w-2, y=mn.y!==undefined?mn.y:(scene==='battle'?174:t?126:174)-h;
    drawBox(x,y,mn.w,h);
    ctx.font=FONT; ctx.fillStyle='#20202a';
    mn.opts.forEach((o,i)=>{
      ctx.fillText(o,x+15,y+16+i*12);
      if(i===mn.sel){ ctx.beginPath(); ctx.moveTo(x+7,y+9+i*12); ctx.lineTo(x+12,y+12.5+i*12); ctx.lineTo(x+7,y+16+i*12); ctx.fill(); }
    });
  }
}
function render(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.imageSmoothingEnabled=false; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  if(scene==='title') drawTitle();
  else if(scene==='battle'&&B) drawBattle();
  else drawWorld();
  drawUI();
  if(fx.a>0){ ctx.globalAlpha=Math.min(1,fx.a); R(0,0,W,H,'#000'); ctx.globalAlpha=1; }
}

// ------------------------------ LOOP ----------------------------------
function update(){
  frame++;
  if(ui.text&&ui.text.n<999) ui.text.n+=1.3;
  if(banner.t>0) banner.t--;
  if(B){
    for(const k of ['me','foe']){
      const target=B[k].hp, d=target-B.hpS[k];
      B.hpS[k]=Math.abs(d)<.35?target:B.hpS[k]+Math.sign(d)*.35;
    }
  }
  if(scene==='world'){
    if(mv){ mv.t+=held.B?1/5:1/9; if(mv.t>=1){ G.x+=mv.dx; G.y+=mv.dy; mv=null; arrive(); } }
    if(!mv&&!busy&&!ui.menus.length&&!ui.text){
      for(const d of ['up','down','left','right']) if(held[d]){ tryMove(d); break; }
    }
  }
}
let last=0, acc=0;
function loop(ts){
  acc+=Math.min(100,ts-last); last=ts;
  while(acc>=16.6){ update(); acc-=16.6; }
  render();
  requestAnimationFrame(loop);
}
window.CARLOS={ get G(){return G;}, get scene(){return scene;}, get busy(){return busy;}, ui, onPress, held, SPECIES, MOVES, MAPS };
requestAnimationFrame(loop);
</script>

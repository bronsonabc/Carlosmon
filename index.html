  .ab{display:flex;gap:12px;align-items:center}

  .small{width:64px;height:34px;font-size:11px}
  .musbtn{background:#2c2c38;border:2px solid #4a4a5c;border-radius:8px;color:#e8e8f0;font:bold 12px ui-monospace,monospace;padding:6px 12px;cursor:pointer}

// ---------------------------- MONSTERS --------------------------------
const nm=m=>SPECIES[m.sp].name;
function stat(m,k){
  const b=SPECIES[m.sp].base[k];
  return k==='hp' ? Math.floor(b*2*m.lvl/100)+m.lvl+10 : Math.floor(b*2*m.lvl/100)+5;
}
function makeMon(sp,lvl){
  const m={sp,lvl,exp:lvl**3,moves:[]};
  for(const [l,mvn] of learnset(sp)) if(l<=lvl&&!m.moves.includes(mvn)) m.moves.push(mvn);
  m.moves=m.moves.slice(-4);
  m.hp=stat(m,'hp');
  return m;
}
function healAll(){ G.party.forEach(m=>m.hp=stat(m,'hp')); jingle('heal'); }
function typeMult(a,d){ if(TYPES[a].beats.includes(d)) return 2; if(TYPES[d].beats.includes(a)) return .5; return 1; }
function wildMon(){
  const tb=WILD[G.map]||ROUTE1;
  let r=Math.random()*tb.reduce((s,e)=>s+e[1],0);
  for(const [sp,w,lo,hi] of tb){ if((r-=w)<0) return makeMon(sp,lo+rnd(hi-lo+1)); }
  return makeMon('late',3);
}
const partyLabel=m=>`${nm(m).padEnd(15)}L${String(m.lvl).padEnd(3)}${m.hp<=0?'FAINTED':m.hp+'/'+stat(m,'hp')}`;

// ------------------------- TEXT + MENUS -------------------------------
const FONT='bold 9px ui-monospace,Menlo,Consolas,monospace';
function paginate(text){
  ctx.font=FONT;
  const lines=[]; let cur='';
  for(const word of String(text).split(' ')){
    const t=cur?cur+' '+word:word;
    if(ctx.measureText(t).width>220/1 && cur){ lines.push(cur); cur=word; } else cur=t;
  }
  if(cur) lines.push(cur);
  const pages=[]; for(let i=0;i<lines.length;i+=3) pages.push(lines.slice(i,i+3));
  return pages.length?pages:[['']];
}
function say(text){ return new Promise(res=>{ ui.text={pages:paginate(text),page:0,n:0,res,wait:true}; }); }
function setText(text){ ui.text={pages:paginate(text),page:0,n:999,res:null,wait:false}; }
function menu(opts,o={}){
  return new Promise(res=>{ ui.menus.push({opts,sel:o.sel||0,x:o.x,y:o.y,w:o.w||64,cancel:o.cancel!==false,res}); });
}
async function yesNo(q){ setText(q); return (await menu(['YES','NO']))===0; }
async function pickMon(title){
  setText(title);
  return menu(G.party.map(partyLabel),{x:8,y:6,w:224});
}
async function script(fn){
  if(busy) return;
  busy=true;
  try{ await fn(); }catch(e){ console.error(e); }
  finally{ busy=false; ui.text=null; ui.menus.length=0; }
}
async function fadeTo(v){
  const from=fx.a;
  for(let i=1;i<=8;i++){ fx.a=from+(v-from)*i/8; await sleep(22); }
}

const KEYMAP={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right',w:'up',s:'down',a:'left',d:'right',
  z:'A',' ':'A',enter:'A',x:'B',escape:'B',backspace:'B',m:'START'};
window.addEventListener('keydown',e=>{
  const b=KEYMAP[e.key.toLowerCase()]; if(!b) return;
  e.preventDefault(); if(e.repeat) return; held[b]=true; onPress(b);
});
window.addEventListener('keyup',e=>{ const b=KEYMAP[e.key.toLowerCase()]; if(b) held[b]=false; });
window.addEventListener('blur',()=>{ for(const k in held) held[k]=false; });
document.querySelectorAll('[data-btn]').forEach(el=>{
  const b=el.dataset.btn;
  const down=e=>{ e.preventDefault(); held[b]=true; el.classList.add('on'); onPress(b); };
  const up=e=>{ e.preventDefault(); held[b]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up);
  el.addEventListener('pointerleave',up); el.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
});

function onPress(b){
  const mn=ui.menus[ui.menus.length-1];
  if(mn){
    sfx(b==='A'?'ok':b==='B'?(mn.cancel?'back':null):(b==='up'||b==='down')&&mn.opts.length>1?'move':null);
    if(b==='up') mn.sel=(mn.sel+mn.opts.length-1)%mn.opts.length;
    else if(b==='down') mn.sel=(mn.sel+1)%mn.opts.length;
    else if(b==='A'){ ui.menus.pop(); mn.res(mn.sel); }
    else if(b==='B'&&mn.cancel){ ui.menus.pop(); mn.res(-1); }
    return;
  }
  const t=ui.text;
  if(t&&t.wait){
    if(b!=='A'&&b!=='B') return;
    sfx('tick');
    const len=t.pages[t.page].join('').length;
    if(t.n<len) t.n=999;
    else if(t.page<t.pages.length-1){ t.page++; t.n=0; }
    else { t.wait=false; const r=t.res; t.res=null; r(); }
    return;
  }
  if(busy) return;
  if(scene==='title'){ if(b==='A'||b==='START'){ sfx('ok'); script(titleMenu); } return; }
  if(scene==='world'&&!mv){
    if(b==='A') interact();
    else if(b==='START'){ sfx('ok'); script(startMenu); }
  }
}

const rivalPick=sp=>({gym:'nap',nap:'snack',snack:'gym'})[sp];   // rival takes the Carlos that beats yours

function ballEnt(sp,x){
  return { kind:'ball', map:'lab', x, y:3, hidden:()=>G.flags.starter===sp||G.flags.rival===sp,
    talk:async()=>{
      if(G.flags.starter){ await say("That's Professor Carlos's last Carlos. Better leave it."); return; }
      if(!G.flags.metProf){ await say('Better talk to Professor Carlos first.'); return; }
      const s=SPECIES[sp];
      await say(`It's ${s.name}, the ${s.type}-type Carlos. ${s.desc}`);
      if(!(await yesNo(`Choose ${s.name}?`))) return;
      G.party.push(makeMon(sp,5)); G.flags.starter=sp;
      await say(`You received ${s.name}!`);
      const r=rivalPick(sp); G.flags.rival=r;
      await say(`RIVAL CARLOS: Then I'm taking ${SPECIES[r].name}!`);
      await say("RIVAL CARLOS: Hey, Carlos! Let's find out whose Carlos is the most Carlos!");
      const res=await battle({name:'RIVAL CARLOS',party:[makeMon(r,5)],prize:175,look:LOOKS.rival});
      healAll();
      await say(res==='win'?'RIVAL CARLOS: What?! I picked the wrong Carlos...':"RIVAL CARLOS: Ha! I'm the superior Carlos!");
      await say("PROF. CARLOS: Splendid, Carloses! I've patched your Carlos up, good as new.");
      await say('PROF. CARLOS: Head north through ROUTE 1 to CARLOS CITY. The CARLOSMART there sells CARLOSBALLS. With those, you can catch wild Carloses of your own!');
      await say('RIVAL CARLOS: Later, Carlos. Try to keep up!');
      G.flags.rivalGone=true;
    } };
}

    await say(text);

}

const visible=e=>!(e.hidden&&e.hidden());
const entityAt=(map,x,y)=>ENT.find(e=>e.map===map&&e.x===x&&e.y===y&&visible(e));

async function shop(){
  if(!G.flags.freeBalls){
    G.flags.freeBalls=true; G.bag.ball+=3;
    await say('CLERK CARLOS: Welcome to the CARLOSMART! First time? Here, 3 CARLOSBALLS on the house.');
    await say('You got 3 CARLOSBALLS! Throw them at wild Carloses to catch them.');
  } else await say('CLERK CARLOS: Welcome back to the CARLOSMART!');
  while(true){
    setText(`Money: $${G.money}   CARLOSBALLS: ${G.bag.ball}   COLAS: ${G.bag.cola}`);
    const c=await menu([`CARLOSBALL   $${PRICES.ball}`,`CARLOS COLA  $${PRICES.cola}`,`BIG GULP     $${PRICES.big}`,'LEAVE'],{w:124});
    if(c<0||c===3) break;
    const key=['ball','cola','big'][c];
    if(G.money<PRICES[key]){ await say("CLERK CARLOS: You don't have enough money, Carlos."); continue; }
    G.money-=PRICES[key]; G.bag[key]=(G.bag[key]||0)+1;
  }
  await say('CLERK CARLOS: Come again, Carlos!');
}

// ---------------------------- OVERWORLD -------------------------------
// Never leave the player standing inside something solid (e.g. an old save after a map changed).
function ensureSafe(){
  const ok=(x,y)=>canWalk(G.map,x,y)&&!WARPS[G.map+':'+x+','+y]&&tileAt(G.map,x,y)!=='M';
  if(canWalk(G.map,G.x,G.y)) return;
  for(let r=1;r<40;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    if(ok(G.x+dx,G.y+dy)){ G.x+=dx; G.y+=dy; return; }
  }
}
// Saves from before the zones were redrawn: move anyone in those zones to the town's bus stop.
function migrateSave(){
  const Z=['s4','s5','s6','s7','s8'];
  if((G.layoutV||1)<2){
    const stop=m=>{ const b=BUS.find(b=>b.map===m); return {map:m,x:b.x,y:b.y,dir:'down'}; };
    if(Z.includes(G.map)) Object.assign(G,stop(G.map));
    if(G.ret&&Z.includes(G.ret.map)) G.ret=stop(G.ret.map);
    if(G.heal&&G.heal.ret&&Z.includes(G.heal.ret.map)) G.heal.ret=stop(G.heal.ret.map);
    G.layoutV=2;
  }
  ensureSafe();
}
function canWalk(map,x,y){
  const m=MAPS[map]; if(y<0||y>=m.rows.length||x<0||x>=m.rows[0].length) return false;
  return !SOLID.has(m.rows[y][x]) && !entityAt(map,x,y);
}
function tryMove(dir){
  G.dir=dir; const [dx,dy]=DIRS[dir];
  if(canWalk(G.map,G.x+dx,G.y+dy)) mv={dx,dy,t:0};
  else if(frame-(tryMove.last||0)>24){ tryMove.last=frame; sfx('bump'); }
}
function showBanner(){ const n=areaName(); G.seen[n]=true; if(n!==banner.text){ banner.text=n; banner.t=130; } }
async function warpTo(w){
  sfx('door');
  await fadeTo(1);
  if(!MAPS[w.map].outside) G.ret=w.ret||{map:G.map,x:G.x,y:G.y+1,dir:'down'};
  G.map=w.map; G.x=w.x; G.y=w.y; G.dir=w.dir;
  ensureSafe();
  showBanner();
  await fadeTo(0);
}
function arrive(){
  const w=WARPS[G.map+':'+G.x+','+G.y];
  if(w){ script(()=>warpTo(w)); return; }
  const t=tileAt(G.map,G.x,G.y);
  if(t==='M'){ script(()=>warpTo(G.ret||EXITS[G.map])); return; }
  showBanner();
  if(checkTrainers()) return;
  if(G.party.length&&((t===':'&&Math.random()<.13)||((t==='c'||t==='h')&&Math.random()<.055))){
    script(async()=>{ const r=await battle({wild:true,party:[wildMon()]}); if(r==='lose') await blackout(); });
  }
}
function checkTrainers(){
  for(const e of ENT){
    if(e.map!==G.map||!e.trainer||e.trainer.noSight||G.beaten[e.id]) continue;
    const [dx,dy]=DIRS[e.dir];
    for(let i=1;i<=4;i++){
      const x=e.x+dx*i,y=e.y+dy*i;
      if(x===G.x&&y===G.y){ script(()=>trainerBattle(e,true)); return true; }
      if(SOLID.has(tileAt(e.map,x,y))) break;
    }
  }
  return false;
}
async function trainerBattle(e,spotted){
  if(spotted){ e.alert=frame+45; await sleep(700); }
  const tr=e.trainer;
  await say(tr.intro);
  const r=await battle({name:tr.name,party:(typeof tr.party==='function'?tr.party():tr.party).map(([sp,l])=>makeMon(sp,l)),prize:tr.prize,boss:!!tr.noSight,look:e.look});
  if(r==='win'){ G.beaten[e.id]=true; await say(tr.outro); if(tr.onWin) await tr.onWin(); }
  else await blackout();
}
async function blackout(){
  await fadeTo(1);
  G.map=G.heal.map; G.x=G.heal.x; G.y=G.heal.y; G.dir='down'; G.ret=G.heal.ret||null;
  healAll(); banner.text='';
  await fadeTo(0);
  await say('You hurried back to safety. Your Carloses are rested and ready to go again!');
}
function interact(){
  const [dx,dy]=DIRS[G.dir]; let x=G.x+dx,y=G.y+dy;
  let t=tileAt(G.map,x,y), e=entityAt(G.map,x,y);
  if(!e&&t==='C') e=entityAt(G.map,x+dx,y+dy);     // talk across a counter
  if(e){
    if(e.look&&!e.still) e.dir=OPP[G.dir];
    if(e.trainer) script(G.beaten[e.id]?()=>say(e.trainer.after||e.trainer.outro):()=>trainerBattle(e,false));
    else script(e.talk);
    return;
  }
  const msg={
    S:SIGNS[G.map+':'+x+','+y]||SIGNS[x+','+y], P:null, Q:'A grill. It is hot. Do not touch the grill.', d:"It's locked. Nobody's home.", K:'Shelves full of books about Carlos. All of them.',
    B:G.map==='house'?"Your bed. No time for a nap, there are Carloses out there.":'A bed. Not yours. Carlos would be upset.', G:'A gravestone. It says CARLOS. They all say CARLOS.', H:'A machine that goes "ding" when your Carloses are healed.',
    p:'A houseplant. It is not a Carlos. Probably.', '~':'The water looks cold. Carlos-cold.',
    y:'A palm tree. Coconuts not included.', z:'A dead tree. It looks like it is judging you.', U:'A fountain. Someone threw a CARLOSBALL in for luck.',
    l:'A street lamp.', e:'A bench. Nobody is sitting on it. Probably a ghost is.', n:'A neatly trimmed hedge.', O:'A big rock.',
    Y:'A boat. It is named CARLOS.', Z:'A tall building. Every window has a Carlos in it.', V:'A parked car. The license plate says CARLOS.',
    J:'An iron fence.', I:'The lighthouse. It keeps the Carloses off the rocks.', i:'The lighthouse lamp.', '%':'Old stone. It is cold to the touch.',
    T:G.map==='house'?'Mom Carlos left you a note: "Go see Professor Carlos!"':null,
  }[t];
  if(t==='P'){ script(pcMenu); return; }
  if(msg) script(()=>say(msg));
}

async function startMenu(){
  while(true){
    ui.text=null;
    const c=await menu(['CARLOSES','BAG','CARD','SAVE','CLOSE'],{x:164,y:6,w:70});
    if(c===0){
      if(!G.party.length){ await say("You don't have any Carloses yet."); continue; }
      const i=await pickMon('Your Carloses. Pick one for details.');
      if(i<0) continue;
      const m=G.party[i], s=SPECIES[m.sp];
      await say(`${s.name}: ${s.type} type, level ${m.lvl}. Moves: ${m.moves.join(', ')}. ${s.desc}`);
      if(i>0 && await yesNo(`Put ${s.name} at the front of your party?`)){ G.party.splice(i,1); G.party.unshift(m); }
    } else if(c===1){
      setText(`Money: $${G.money}   CARLOSBALLS: ${G.bag.ball}   CARLOS COLAS: ${G.bag.cola}`);
      const j=await menu([`COLA x${G.bag.cola}`,`BIG GULP x${G.bag.big||0}`,'BACK'],{w:92});
      if(j===0||j===1){
        const key=j?'big':'cola';
        if(!G.bag[key]){ await say('You are out of those.'); continue; }
        if(!G.party.length){ await say('Nobody to give it to.'); continue; }
        const i=await pickMon('Give it to which Carlos?');
        if(i>=0) await useCola(G.party[i],key);
      }
    } else if(c===2){
      await say(`TRAINER: CARLOS.  Money: $${G.money}.  Carloses owned: ${G.party.length+G.box.length}.  Badges: ${G.badges.length?G.badges.join(', '):'none yet'}.`);
    } else if(c===3){

// ------------------------------ BATTLE --------------------------------
const stageMult=s=>s>=0?(2+s)/2:2/(2-s);
const label=who=>who==='me'?nm(B.me):(B.wild?'Wild ':'Foe ')+nm(B.foe);

async function battleIntro(kind){
  AU.override=null; sfx('encounter');
  for(let i=0;i<3;i++){ fx.flash='#ffffff'; await sleep(55); fx.flash='#000000'; await sleep(55); }
  fx.flash=null;
  fx.wipe={type:kind==='wild'?'bars':kind==='trainer'?'spiral':'iris',p:0};
  for(let i=1;i<=26;i++){ fx.wipe.p=i/26; await sleep(24); }
  fx.a=1; fx.wipe=null; await sleep(90);
}
async function slideOut(who){   // a trainer steps aside before their Carlos comes out
  for(let i=1;i<=10;i++){ B.tOff[who]=i/10; await sleep(22); }
  if(who==='foe') B.trainerFoe=null; else B.trainerMe=false;
}
async function battle(o){
  const kind=o.wild?(o.boss?'legend':'wild'):(o.boss||/RIVAL|CHAMPION|BOSS/.test(o.name||''))?'leader':'trainer';
  await battleIntro(kind);
  const foes=o.party; let fi=0, result;
  B={foe:foes[0],me:G.party.find(m=>m.hp>0),wild:!!o.wild,name:o.name,music:kind==='wild'?'wild':kind==='trainer'?'trainer':'leader',showFoe:!!o.wild,showMe:false,slide:0,tOff:{foe:0,me:0},trainerFoe:o.wild?null:(o.look||null),trainerMe:true,
     st:{me:{atk:0,def:0},foe:{atk:0,def:0}},hpS:{},hit:{},ball:null};
  B.hpS.me=B.me.hp; B.hpS.foe=B.foe.hp;
  scene='battle'; ui.text=null; AU.override=B.music;
  fx.a=0;
  for(let i=1;i<=20;i++){ B.slide=i/20; await sleep(26); }
  if(o.wild) await say(`A wild ${nm(B.foe)} appeared!`);
  else { await say(`${o.name} wants to battle!`); if(B.trainerFoe) await slideOut('foe'); B.showFoe=true; sfx('send'); await say(`${o.name} sent out ${nm(B.foe)}!`); }
  await slideOut('me'); B.showMe=true; sfx('send'); await say(`Go! ${nm(B.me)}!`);

  while(true){
    // ---- choose an action
    let act=null;
    while(!act){
      setText(`What will ${nm(B.me)} do?`);
      const c=await menu(['FIGHT','BAG','CARLOSES','RUN'],{cancel:false,w:70});
      if(c===0){
        const ms=B.me.moves;
        const i=await menu(ms.map(n=>n.padEnd(18)+MOVES[n].type),{w:164});
        if(i>=0) act={t:'move',mv:ms[i]};
      } else if(c===1){
        const keys=Object.keys(ITEMS).filter(k=>k==='ball'||G.bag[k]);
        const i=await menu(keys.map(k=>`${ITEMS[k].name} x${G.bag[k]||0}`),{w:112});
        if(i>=0){
          const k=keys[i];
          if(ITEMS[k].heal){ if(await useCola(B.me,k)) act={t:'item'}; }
          else if(!o.wild) await say("You can't catch someone else's Carlos! That's just rude.");
          else if(!G.bag[k]) await say('You have no CARLOSBALLS! Any CARLOSMART sells them.');
          else act={t:'ball',key:k};
        }
      } else if(c===2){
        const i=await pickMon('Switch to which Carlos?');
        if(i>=0){
          if(G.party[i]===B.me) await say(`${nm(B.me)} is already out there!`);
          else if(G.party[i].hp<=0) await say(`${nm(G.party[i])} has no energy left!`);
          else act={t:'switch',i};
        }
      } else {
        if(!o.wild) await say("There's no running from a Carlos battle!");
        else act={t:'run'};
      }
    }
    // ---- your non-attack actions happen first
    if(act.t==='run'){
      if(Math.random()<.9){ sfx('run'); await say('Got away safely!'); result='run'; break; }
      await say("Couldn't get away!");
    } else if(act.t==='switch'){
      await say(`${nm(B.me)}, come back!`);
      B.me=G.party[act.i]; B.st.me={atk:0,def:0}; B.hpS.me=B.me.hp;
      await say(`Go! ${nm(B.me)}!`);
    } else if(act.t==='ball'){
      if(await throwBall(act.key)){ result='caught'; break; }
    }
    // ---- attacks, fastest first
    const foeMove=pick(B.foe.moves);
    const order=act.t!=='move'?['foe']:(stat(B.me,'spd')>=stat(B.foe,'spd')?['me','foe']:['foe','me']);
    for(const who of order){
      if(B.me.hp<=0||B.foe.hp<=0) break;
      await useMove(who,who==='me'?act.mv:foeMove);
    }
    // ---- faints
    if(B.foe.hp<=0){
      sfx('faint'); await say(`${label('foe')} fainted!`); B.showFoe=false;
      await gainExp(B.me,Math.floor(SPECIES[B.foe.sp].exp*B.foe.lvl/7*(o.wild?1:1.6)));
      if(++fi<foes.length){
        B.foe=foes[fi]; B.st.foe={atk:0,def:0}; B.hpS.foe=B.foe.hp; B.showFoe=true;
        await say(`${o.name} sent out ${nm(B.foe)}!`);
        continue;
      }
      result='win'; break;
    }
    if(B.me.hp<=0){
      sfx('faint'); await say(`${nm(B.me)} fainted!`);
      if(!G.party.some(m=>m.hp>0)){ result='lose'; break; }
      let i=-1;
      while(i<0||G.party[i].hp<=0) i=await pickMon('Send out which Carlos?');
      B.me=G.party[i]; B.st.me={atk:0,def:0}; B.hpS.me=B.me.hp;
      await say(`Go! ${nm(B.me)}!`);
    }
  }
  if(result==='win'||result==='caught'){ AU.override=null; setTrack(null); jingle(result==='win'?'win':'catch'); }
  if(result==='win'&&!o.wild){
    await say(`You defeated ${o.name}!`);
    G.money+=o.prize; await say(`You got $${o.prize} for winning!`);
  }
  if(result==='lose') await say("You're out of Carloses that can battle!");
  await fadeTo(1);
  scene='world'; B=null; ui.text=null; AU.override=undefined;
  await fadeTo(0);
  return result;
}

async function useMove(who,name){
  const me=who==='me', A=me?B.me:B.foe, D=me?B.foe:B.me, dk=me?'foe':'me';
  const m=MOVES[name];
  await say(`${label(who)} used ${name.toUpperCase()}!`);
  if(Math.random()*100>=(m.acc||100)){ sfx('miss'); await say('But it missed!'); return; }
  sfx('atk',m.type);
  if(m.kind==='heal'){
    const max=stat(A,'hp');
    if(A.hp>=max){ await say('But nothing happened!'); return; }
    A.hp=Math.min(max,A.hp+Math.ceil(max/2)); sfx('heal',null,.3); await sleep(500);
    await say(`${label(who)} feels refreshed!`);
  } else if(m.kind==='atkDown'||m.kind==='defDown'){
    const k=m.kind==='atkDown'?'atk':'def';
    if(m.flavor) await say(m.flavor);
    if(B.st[dk][k]<=-6){ await say('But nothing happened!'); return; }
    B.st[dk][k]--; sfx('down');
    await say(`${label(dk)}'s ${k==='atk'?'ATTACK':'DEFENSE'} fell!`);
  } else {
    const eff=typeMult(m.type,SPECIES[D.sp].type);
    const crit=Math.random()<.06?1.5:1;
    const stab=m.type===SPECIES[A.sp].type?1.5:1;
    const atk=stat(A,'atk')*stageMult(B.st[who].atk), def=stat(D,'def')*stageMult(B.st[dk].def);
    let dmg=Math.floor(((2*A.lvl/5+2)*m.power*atk/def)/50+2);
    dmg=Math.max(1,Math.floor(dmg*eff*crit*stab*(.85+Math.random()*.15)));
    D.hp=Math.max(0,D.hp-dmg);
    B.hit[dk]=frame+30; sfx(eff>1?'hitbig':eff<1?'hitweak':'hit',null,.24); if(crit>1) sfx('crit',null,.3);
    await sleep(650);
    if(m.flavor) await say(m.flavor);
    if(crit>1) await say('A critical hit!');
    if(eff>1) await say("It's super effective!");
    if(eff<1) await say("It's not very effective...");
  }
}

async function gainExp(m,amount){
  m.exp+=amount;
  await say(`${nm(m)} gained ${amount} EXP!`);
  while(m.exp>=(m.lvl+1)**3 && m.lvl<100){
    const old=stat(m,'hp'); m.lvl++; m.hp+=stat(m,'hp')-old;
    jingle('level');
    await say(`${nm(m)} grew to level ${m.lvl}!`);
    for(const [l,mvn] of learnset(m.sp)){
      if(l===m.lvl&&!m.moves.includes(mvn)){
        if(m.moves.length>=4) m.moves.shift();
        m.moves.push(mvn);
        await say(`${nm(m)} learned ${mvn.toUpperCase()}!`);
      }
    }
  }
  const ev=SPECIES[m.sp].evolve;
  if(ev&&m.lvl>=ev[0]){
    const before=nm(m), old=stat(m,'hp');
    await say(`What? ${before} is having a GLOW-UP!`);
    if(B){ B.hit.me=frame+70; } await sleep(1200);
    m.sp=ev[1]; m.hp+=stat(m,'hp')-old;
    await say(`${before} became ${nm(m)}!`);
  }
}

async function throwBall(){
  const f=B.foe, s=SPECIES[f.sp];
  G.bag.ball--;
  await say('You threw a CARLOSBALL!');
  B.showFoe=false; B.ball={shake:false};
  const p=Math.min(.97,s.catch*(3-2*f.hp/stat(f,'hp')));
  const per=Math.cbrt(p);
  let ok=true;
  for(let i=0;i<3;i++){
    await sleep(350); B.ball.shake=true; await sleep(450); B.ball.shake=false;
    if(Math.random()>per){ ok=false; break; }
  }
  if(!ok){
    B.ball=null; B.showFoe=true;
    await say(pick(['Argh! It broke free!','So close! The Carlos escaped!','Nope! It popped right out!']));
    return false;
  }
  await sleep(300);
  await say(`Gotcha! ${s.name} was caught!`);
  if(G.party.length<6) G.party.push(f);
  else { G.box.push(f); await say(`Your party is full, so ${s.name} was sent to Professor Carlos's lab.`); }
  B.ball=null;
  return true;
}

// ---------------------------- DRAWING ---------------------------------
const R=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); };

// ------------------------------- ART ----------------------------------
// Everything is drawn in code. Characters are painted once into a small
// canvas (with a dark outline) and reused; each map is painted once into
// a big canvas, and only animated tiles (water, flowers...) are redrawn.

function hexRGB(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h.slice(0,6),16); return [n>>16&255,n>>8&255,n&255]; }
function shadeCol(h,f){   // f<0 darkens, f>0 lightens
  if(typeof h!=='string'||h[0]!=='#') return h;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));
  const [r,g,b]=hexRGB(h); return 'rgb('+m(r)+','+m(g)+','+m(b)+')';
}

// Draws a Carlos on a 16x16 grid. Used for people AND monsters.
function paintCarlos(c,ox,oy,look,dir,step,flip){
  const skin=look.skin||'#e2ac7c', hair=look.hair||'#6b4226', shirt=look.shirt||'#4a78c8', pants=look.pants||'#35405c';
  const p=(x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(ox+(flip?16-x-w:x),oy+y,w,h); };
  const l1=step===1?1:0, l2=step===2?1:0, sd=shadeCol(shirt,-.22);
  p(5,13,2,2-l1,pants); p(9,13,2,2-l2,pants); p(5,15-l1,2,1,'#20202a'); p(9,15-l2,2,1,'#20202a');
  p(9,13,2,1,shadeCol(pants,-.25));
  p(4,8,8,5,shirt); p(3,8,1,4,shirt); p(12,8,1,4,shirt); p(3,12,1,1,skin); p(12,12,1,1,skin);
  p(4,12,8,1,sd); p(12,8,1,4,sd); p(11,9,1,3,sd); p(5,8,3,1,shadeCol(shirt,.18));
  if(look.wide){ p(2,8,1,4,shirt); p(13,8,1,4,sd); }
  if(look.sleeveless){ p(3,8,1,4,skin); p(12,8,1,4,skin); p(2,8,1,3,skin); p(13,8,1,3,skin); }
  if(look.robe){ p(4,8,8,7,shirt); p(7,8,2,7,'#ffffff'); p(10,9,2,6,sd); }
  if(look.bib&&dir!=='up'){ p(6,8,4,3,'#ffffff'); }
  if(look.coat){ p(4,8,3,5,'#f4f4f4'); p(9,8,3,5,'#e4e6ea'); p(3,8,1,4,'#f4f4f4'); p(12,8,1,4,'#d8dbe0'); }
  if(look.apron) p(5,9,6,4,'#ffffff');
  if(look.tie&&dir!=='up') p(7,8,2,4,'#b03030');
  const shade='#c48a5c';
  p(4,2,8,4,skin); p(5,6,6,1,skin); p(6,7,4,1,skin); p(7,8,2,1,skin);
  if(dir==='up'){ p(3,1,10,6,hair); p(5,1,4,1,shadeCol(hair,.2)); if(look.longHair) p(3,7,10,3,hair); }
  else {
    p(4,1,8,2,hair); p(3,2,1,3,hair); p(12,2,1,3,hair); p(4,0,6,1,hair); p(10,1,2,1,'#855634');
    p(5,1,3,1,shadeCol(hair,.22));
    p(4,5,1,1,shade); p(11,5,1,1,shade); p(5,6,1,1,shade); p(10,6,1,1,shade);
    if(look.longHair){ p(3,2,1,8,hair); p(12,2,1,8,hair); }
    if(look.spiky){ p(4,0,1,1,hair); p(6,0,2,1,hair); p(9,0,1,1,hair); p(11,0,1,1,hair); }
    const ex=dir==='left'?-1:dir==='right'?1:0;

    else if(look.shades){ p(5+ex,4,6,2,'#15151a'); p(6+ex,4,1,1,'#5a6a8a'); }

const LAYER={map:null,c:null};

function mapLayer(id){
  if(LAYER.map===id&&LAYER.c) return LAYER.c;
  const m=MAPS[id], w=m.rows[0].length, h=m.rows.length;
  const c=document.createElement('canvas'); c.width=w*T; c.height=h*T;
  const keep=ctx; ctx=c.getContext('2d');

  finally{ ctx=keep; }

}

// Flashes, then the screen closes in: stripes for wild Carloses, a spiral for trainers,
// a shrinking circle for leaders and legends.
let SPIRAL=null;
function spiralOrder(w,h){
  const out=[]; let x0=0,y0=0,x1=w-1,y1=h-1;
  while(x0<=x1&&y0<=y1){
    for(let x=x0;x<=x1;x++) out.push([x,y0]);
    for(let y=y0+1;y<=y1;y++) out.push([x1,y]);
    if(y0<y1) for(let x=x1-1;x>=x0;x--) out.push([x,y1]);
    if(x0<x1) for(let y=y1-1;y>y0;y--) out.push([x0,y]);
    x0++; y0++; x1--; y1--;
  }
  return out;
}
function drawWipe(){
  if(fx.flash){ ctx.globalAlpha=.72; R(0,0,W,H,fx.flash); ctx.globalAlpha=1; }
  const w=fx.wipe; if(!w) return;
  const p=Math.min(1,w.p), K='#08060c';
  if(w.type==='bars'){
    const n=8, bh=H/n;
    for(let i=0;i<n;i++){ const bw=Math.round(W*Math.min(1,p*1.15-(i%4)*.05)); if(bw<=0) continue;
      const y=Math.round(i*bh), hh=Math.round((i+1)*bh)-y;
      if(i%2) R(W-bw,y,bw,hh,K); else R(0,y,bw,hh,K); }
  } else if(w.type==='spiral'){
    if(!SPIRAL) SPIRAL=spiralOrder(15,11);
    const n=Math.floor(p*SPIRAL.length);
    for(let i=0;i<n;i++){ const [x,y]=SPIRAL[i]; R(x*16,y*16,16,16,K); }
  } else {
    const r=Math.max(0,Math.round((1-p)*150/4)*4), cx=W/2, cy=H/2;
    for(let y=0;y<H;y+=4){ const dy=y+2-cy, hw=r>Math.abs(dy)?Math.round(Math.sqrt(r*r-dy*dy)/4)*4:0;
      R(0,y,cx-hw,4,K); R(cx+hw,y,W-cx-hw,4,K); }
  }
}

const ITEMS={
  ball:{name:'CARLOSBALL',price:100},
  sball:{name:'SUPER BALL',price:350,badges:3},
  cola:{name:'CARLOS COLA',price:80,heal:20},

async function shop(){
  if(!G.flags.freeBalls){
    G.flags.freeBalls=true; G.bag.ball+=3;
    await say('CLERK CARLOS: Welcome to the CARLOSMART! First time? Here, 3 CARLOSBALLS on the house.');
    await say('You got 3 CARLOSBALLS! Throw them at wild Carloses to catch them.');
  } else await say('CLERK CARLOS: Welcome back to the CARLOSMART!');
  while(true){
    const keys=Object.keys(ITEMS).filter(k=>G.badges.length>=(ITEMS[k].badges||0));
    setText(`Money: $${G.money}`);
    const c=await menu(keys.map(k=>`${ITEMS[k].name.padEnd(12)}$${String(ITEMS[k].price).padEnd(4)}x${G.bag[k]||0}`).concat('LEAVE'),{w:140});
    if(c<0||c===keys.length) break;
    const k=keys[c];
    if(G.money<ITEMS[k].price){ await say("CLERK CARLOS: You don't have enough money, Carlos."); continue; }
    G.money-=ITEMS[k].price; G.bag[k]=(G.bag[k]||0)+1;
  }
  await say('CLERK CARLOS: Come again, Carlos!');
}
async function useCola(m,key){
  key=key||'cola'; const it=ITEMS[key];
  if(m.hp<=0){ await say(`${nm(m)} has fainted. Cola can't fix that.`); return false; }
  if(m.hp>=stat(m,'hp')){ await say(`${nm(m)} is already at full HP.`); return false; }
  G.bag[key]--; m.hp=Math.min(stat(m,'hp'),m.hp+it.heal); sfx('heal');
  await say(`${nm(m)} chugged the ${it.name} and recovered HP!`);
  return true;
}
async function throwBall(key){
  key=key||'ball';
  const f=B.foe, s=SPECIES[f.sp];
  G.bag[key]--;
  sfx('throw');
  await say(`You threw a ${ITEMS[key].name}!`);
  B.showFoe=false; B.ball={shake:false};
  const p=Math.min(.97,s.catch*(key==='sball'?1.8:1)*(3-2*f.hp/stat(f,'hp')));
  const per=Math.cbrt(p);
  let ok=true;
  for(let i=0;i<3;i++){
    await sleep(350); B.ball.shake=true; sfx('shake'); await sleep(450); B.ball.shake=false;
    if(Math.random()>per){ ok=false; break; }
  }
  if(!ok){
    B.ball=null; B.showFoe=true;
    await say(pick(['Argh! It broke free!','So close! The Carlos escaped!','Nope! It popped right out!']));
    return false;
  }
  await sleep(300);
  await say(`Gotcha! ${s.name} was caught!`);
  if(G.party.length<6) G.party.push(f);
  else { G.box.push(f); await say(`Your party is full, so ${s.name} was sent to CARLOS STORAGE.`); }
  B.ball=null;
  return true;
}

async function startMenu(){
  while(true){
    ui.text=null;
    const c=await menu(['CARLOSES','BAG','CARD','TYPES','SAVE','CLOSE'],{x:164,y:6,w:70});
    if(c===0){
      if(!G.party.length){ await say("You don't have any Carloses yet."); continue; }
      const i=await pickMon('Your Carloses. Pick one for details.');
      if(i<0) continue;
      const m=G.party[i], s=SPECIES[m.sp];
      await say(`${s.name}: ${s.type} type, level ${m.lvl}. Moves: ${m.moves.join(', ')}. ${s.desc}`);
      if(i>0 && await yesNo(`Put ${s.name} at the front of your party?`)){ G.party.splice(i,1); G.party.unshift(m); }
    } else if(c===1){
      const keys=Object.keys(ITEMS).filter(k=>G.bag[k]);
      setText(`Money: $${G.money}.  `+(keys.length?keys.map(k=>`${ITEMS[k].name} x${G.bag[k]}`).join(', '):'Your bag is empty.'));
      const heal=keys.filter(k=>ITEMS[k].heal);
      const j=await menu(heal.map(k=>'USE '+ITEMS[k].name).concat('BACK'),{w:112});
      if(j>=0&&j<heal.length){
        if(!G.party.length){ await say('Nobody to give it to.'); continue; }
        const i=await pickMon('Give it to which Carlos?');
        if(i>=0) await useCola(G.party[i],heal[j]);
      }
    } else if(c===2){
      const keyItems=[G.flags.card&&'GYM MEMBERSHIP',G.flags.horn&&'AIR HORN',G.flags.safari&&'SAFARI PASS'].filter(Boolean);
      await say(`TRAINER: CARLOS.  Money: $${G.money}.  Carloses owned: ${G.party.length+G.box.length}.  Badges (${G.badges.length}/8): ${G.badges.length?G.badges.join(', '):'none yet'}.${keyItems.length?'  Key items: '+keyItems.join(', ')+'.':''}${G.flags.champion?'  CARLOS LEAGUE CHAMPION!':''}`);
    } else if(c===3){
      await say(TYPE_CHART);
    } else if(c===4){
      await say(save()?'Game saved!':'Could not save in this browser.');
    } else break;
  }
}

// ---- map tools
function mkMap(id,w,h,fill,opts,fn){
  const m=[]; for(let y=0;y<h;y++) m.push(Array(w).fill(fill));
  const t={ rect:(x,y,ww,hh,c)=>{ for(let j=y;j<y+hh;j++) for(let i=x;i<x+ww;i++) m[j][i]=c; }, put:(x,y,c)=>{ m[y][x]=c; } };
  t.bld=(x,y,ww,roof,doorX,doorCh)=>{ t.rect(x,y,ww,2,roof); for(let i=0;i<ww;i++) t.put(x+i,y+2,(x+i===doorX)?(doorCh||'D'):(i%2?'w':'W')); };
  t.flowers=list=>list.forEach(([x,y])=>{ if(m[y][x]==='.') m[y][x]='f'; });
  t.scatter=(c,list)=>list.forEach(([x,y])=>t.put(x,y,c));
  t.line=(pts,c)=>{ for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; t.rect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0)+1,Math.abs(y1-y0)+1,c); } };
  // house: roof rows, then wall rows (windows), the bottom wall row has the door
  t.house=(x,y,ww,roofRows,wallRows,roof,doorX,doorCh)=>{ t.rect(x,y,ww,roofRows,roof);
    for(let r=0;r<wallRows;r++) for(let i=0;i<ww;i++) t.put(x+i,y+roofRows+r,(r===wallRows-1&&x+i===doorX)?(doorCh||'D'):(i%2?'w':'W')); };
  // tower: one row of roof, glass floors below, optional door on the ground floor
  t.tower=(x,y,ww,hh,doorX,doorCh)=>{ t.rect(x,y,ww,1,'g'); t.rect(x,y+1,ww,hh-1,'Z'); if(doorX!=null) t.put(doorX,y+hh-1,doorCh||'D'); };
  fn(t);
  MAPS[id]=Object.assign({rows:m.map(r=>r.join(''))},opts);
}
function setTile(map,x,y,c){ const r=MAPS[map].rows; r[y]=r[y].slice(0,x)+c+r[y].slice(x+1); }
function Tr(id,map,x,y,dir,look,name,party,prize,intro,outro,extra){
  return {id,map,x,y,dir,look,trainer:Object.assign({name,party,prize,intro,outro},extra||{})};
}
function npc(map,x,y,dir,look,text,hidden){ return {map,x,y,dir,look,hidden,talk:async()=>{ for(const t of [].concat(text)) await say(t); }}; }

function busDriver(map,x,y,dir){
  return {map,x,y,dir:dir||'up',look:LOOKS.bus,talk:async()=>{
    const here=areaName();
    const stops=BUS.filter(s=>G.seen[s.name]&&s.name!==here);
    if(!stops.length){ await say('BUS DRIVER CARLOS: The CARLOS BUS goes to any town you have already visited. You have not been anywhere else yet!'); return; }
    setText('BUS DRIVER CARLOS: All aboard the CARLOS BUS! Where to?');
    const i=await menu(stops.map(s=>s.name).concat('NEVER MIND'),{x:118,y:4,w:118});
    if(i<0||i===stops.length) return;
    ui.text=null;
    await warpTo({map:stops[i].map,x:stops[i].x,y:stops[i].y,dir:'up',ret:stops[i].ret});
  }};
}

// =====================================================================
// ZONES from Route 4 on. Each zone is one hand-built map: a route along
// the bottom and a town at the top. You arrive from the south and leave
// to the north. Coordinates are in tiles, (0,0) is the top-left corner.
// =====================================================================
const CENTER_IN={map:'center',x:3,y:5,dir:'up'}, MART_IN={map:'mart',x:3,y:5,dir:'up'};
function zone(o){
  mkMap(o.id,o.w,o.h,'#',{outside:true,theme:o.theme,fogY:o.fogY,area:g=>g.y<o.townEnd?o.town:o.route},o.build);
  const by=o.h-1;
  WARPS[o.id+':'+o.entryX+','+by]=o.back;                       // step off the bottom edge: back to the last zone
  WARPS[o.backFrom]={map:o.id,x:o.entryX,y:by-1,dir:'up'};      // the last zone's exit leads here
  for(const [x,y,to] of o.doors) WARPS[o.id+':'+x+','+y]=to;
  for(const [x,y,text] of o.signs) SIGNS[o.id+':'+x+','+y]=text;
  for(const l of o.labels) LABELS.push(Object.assign({map:o.id},l));
  WILD[o.id]=o.wild;
  const [sx,sy,dx,dy]=o.bus;                                    // bus stop, then where the driver stands
  BUS.push({name:o.town,map:o.id,x:sx,y:sy});

  return {id,map:'gym7',x,y,dir:'down',look:SPECIES.trivia.look,still:true,hidden:()=>G.flags[id],talk:async()=>{
    await say('QUIZ CARLOS: Pop quiz! Get it right and I step aside. Get it wrong and we battle.');

}

const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(n){ const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) throw new Error('bad note '+n); return 12*(+m[3]+1)+SEMI[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); }

function wave(name){

  const add={organ:[0,1,.5,.25,.3,0,.12,0,.1],epiano:[0,1,.35,.1,.06],steel:[0,1,.55,.35,.2,.12,.06]}[name];
  for(let n=1;n<N;n++){
    if(duty) re[n]=(2/(n*Math.PI))*Math.sin(n*Math.PI*duty);

}
function playNote(name,f,t,dur,vol,dest){

    else fl.frequency.value=I.f.freq;

    const lfo=c.createOscillator(); lfo.frequency.value=I.vib[0];
    lfoG=c.createGain(); lfoG.gain.setValueAtTime(0,t); lfoG.gain.linearRampToValueAtTime(I.vib[1],t+I.vib[2]+.12);
    lfo.connect(lfoG); lfo.start(t); lfo.stop(stop);

    const o=c.createOscillator(), og=c.createGain();

// ---- Drum kits. Patterns use k (kick), s (snare), h (hat). Each kit gives them its own sound.
function noiseHit(t,dest,vol,len,type,freq,q){
  const c=AU.ctx, src=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
  src.buffer=AU.noise; f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t+len+.02);
}
function toneHit(t,dest,vol,f0,f1,len,type){
  const c=AU.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+len*.8);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+len+.02);
}
const KITS={
  chip:  {k:(t,d)=>toneHit(t,d,.28,150,45,.12), s:(t,d)=>noiseHit(t,d,.11,.11,'highpass',1400), h:(t,d)=>noiseHit(t,d,.045,.035,'highpass',6500)},
  soft:  {k:(t,d)=>toneHit(t,d,.18,110,50,.15), s:(t,d)=>noiseHit(t,d,.035,.18,'bandpass',3000,.8), h:(t,d)=>noiseHit(t,d,.02,.05,'highpass',8000)},
  heavy: {k:(t,d)=>{ toneHit(t,d,.34,170,40,.16); noiseHit(t,d,.05,.02,'lowpass',2000); },
          s:(t,d)=>{ noiseHit(t,d,.13,.14,'bandpass',1800,.7); toneHit(t,d,.08,220,160,.08,'triangle'); },
          h:(t,d)=>noiseHit(t,d,.05,.05,'highpass',7000)},
  tribal:{k:(t,d)=>toneHit(t,d,.3,95,48,.35), s:(t,d)=>toneHit(t,d,.16,210,120,.22), h:(t,d)=>noiseHit(t,d,.03,.08,'bandpass',5000,2)},
  shaker:{k:(t,d)=>toneHit(t,d,.2,120,55,.14), s:(t,d)=>{ toneHit(t,d,.08,520,480,.1,'triangle'); noiseHit(t,d,.04,.06,'bandpass',4000,1); }, h:(t,d)=>noiseHit(t,d,.045,.06,'bandpass',6000,1.5)},

function buildSong(name){
  const s=SONGS[name], V=VOICES[name]||VOICES.route, steps=s.chords.length*16, ev=[], mg=V.mg||1, RV={}; for(const k in ROLE_VOL) RV[k]=ROLE_VOL[k]*mg;
  for(let i=0;i<steps;i++) ev.push([]);
  const lead=parseLead(s.lead);
  if(lead.len!==steps) console.error(`song ${name}: lead is ${lead.len} steps, expected ${steps}`);
  for(const n of lead.notes){
    ev[n.at%steps].push({i:V.lead,f:hz(n.m),d:n.d,v:RV.lead});
    if(V.dbl) ev[n.at%steps].push({i:V.dbl[0],f:hz(n.m+V.dbl[1]),d:n.d,v:RV.dbl});
  }
  const bi=V.bass, bv=RV.bass;
  s.chords.forEach((c,b)=>{
    const [r,th,fi]=chordTones(c), o=b*16;
    if(s.bass==='eighth') for(let i=0;i<8;i++) ev[o+i*2].push({i:bi,f:hz(i%4===3?fi:r),d:2,v:bv});
    else if(s.bass==='bounce') for(let i=0;i<4;i++) ev[o+i*4].push({i:bi,f:hz(i%2?fi:r),d:3,v:bv});
    else if(s.bass==='long') ev[o].push({i:bi,f:hz(r),d:16,v:bv});
    else if(s.bass==='calypso') [[0,r,3],[3,fi,3],[6,r+12,2],[8,r,3],[11,fi,3],[14,th+12,2]].forEach(([p,n,d])=>ev[o+p].push({i:bi,f:hz(n),d,v:bv}));
    if(V.arp&&s.arp){ const tones=[r+24,th+24,fi+24,th+24]; for(let i=0;i<16;i+=s.arp) ev[o+i].push({i:V.arp,f:hz(tones[(i/s.arp)%4]),d:s.arp,v:RV.arp}); }
    if(V.pad) for(const n of [r+24,th+24,fi+24]) ev[o].push({i:V.pad,f:hz(n),d:16,v:RV.pad});
    const dp=DRUMS[s.drums||'none']; for(let i=0;i<16;i++) if(dp[i]!=='-') ev[o+i].push({drum:dp[i],kit:V.kit});

}
const KIT_VOL={tribal:.72,heavy:.85};
function playEvent(e,t,sd,dest){
  if(e.drum){ const k=KITS[e.kit||'chip']; if(k&&k[e.drum]){ const kv=KIT_VOL[e.kit]; if(kv){ const g=AU.ctx.createGain(); g.gain.value=kv; g.connect(dest); k[e.drum](t,g); } else k[e.drum](t,dest); } return; }

function initAudio(){
  if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  try{
    AU.ctx=new C();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=VOLS[AU.vol];
    const comp=AU.ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; comp.attack.value=.005; comp.release.value=.2;
    AU.master.connect(comp); comp.connect(AU.ctx.destination);

    AU.sfx=AU.ctx.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
    const buf=AU.ctx.createBuffer(1,AU.ctx.sampleRate*.5,AU.ctx.sampleRate), d=buf.getChannelData(0);

function musicTick(){
  if(!AU.ctx||!AU.song||!AU.tg||AU.ctx.state!=='running') return;
  const now=AU.ctx.currentTime;
  if(AU.next<now-.25) AU.next=now+.05;
  while(AU.next<now+.15){
    for(const e of AU.song.ev[AU.step]) playEvent(e,AU.next,AU.song.stepDur,AU.tg);
    AU.next+=AU.song.stepDur; AU.step=(AU.step+1)%AU.song.steps;
  }
}
// Each track gets its own little mixer (with optional echo), so the old one can be cut off cleanly on a switch.
function setTrack(name){
  if(!AU.ctx||name===AU.cur) return;
  const c=AU.ctx, now=c.currentTime;
  if(AU.tgOut){ const old=AU.tgOut; old.gain.cancelScheduledValues(now); old.gain.setValueAtTime(old.gain.value,now); old.gain.linearRampToValueAtTime(0,now+.04); setTimeout(()=>{ try{ old.disconnect(); }catch(e){} },300); }
  AU.tg=c.createGain(); AU.tgOut=c.createGain(); AU.tg.connect(AU.tgOut); AU.tgOut.connect(AU.music);
  AU.cur=name; AU.song=name?AU.built[name]:null; AU.step=0; AU.next=now+.1;
  const e=AU.song&&AU.song.echo;
  if(e){
    const dl=c.createDelay(1), fb=c.createGain(), lp=c.createBiquadFilter(), wet=c.createGain();
    dl.delayTime.value=e[0]; fb.gain.value=e[1]; lp.type='lowpass'; lp.frequency.value=2200; wet.gain.value=e[2];
    AU.tg.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(AU.tgOut);
  }
}
function jingle(name){
  if(!AU.ctx||AU.ctx.state!=='running') return;
  const j=JINGLES[name], sd=60/j.bpm/4, now=AU.ctx.currentTime+.03, p=parseLead(j.lead);
  p.notes.forEach(n=>{
    const t=now+n.at*sd;
    playNote('brass',hz(n.m),t,n.d*sd,.11,AU.master);
    playNote('p25',hz(n.m+12),t,n.d*sd,.035,AU.master);
    playNote('tri',hz(n.m-12),t,n.d*sd,.16,AU.master);
  });

  AU.music.gain.cancelScheduledValues(now); AU.music.gain.setValueAtTime(MUSIC_LEVEL*.3,now); AU.music.gain.setValueAtTime(MUSIC_LEVEL,now+p.len*sd+.15);

function wantedTrack(){
  if(AU.override!==undefined) return AU.override;
  if(scene==='title') return 'title';
  if(scene==='battle'&&B) return B.music||'wild';
  if(!G) return null;
  const m=G.map;
  if(/^gym/.test(m)||m==='hq') return 'gym';
  if(m==='cave'||m==='vr') return 'cave';
  if(m==='tower') return 'spooky';
  if(m==='league') return 'league';
  if(!MAPS[m].outside) return 'inside';
  const a=areaName();
  if(/ROUTE|SAFARI/.test(a)) return 'route';
  return TOWN_MUSIC[a]||'town';
}
function updateMusic(){
  if(!AU.ctx) return;
  setTrack(wantedTrack());
  if(G){ if(AU.badges>=0&&G.badges.length>AU.badges) jingle('badge'); AU.badges=G.badges.length; }
}
function toggleMusic(){
  AU.vol=(AU.vol+1)%VOLS.length; AU.on=AU.vol>0; initAudio();
  if(AU.master) AU.master.gain.value=VOLS[AU.vol];
  try{ localStorage.setItem('carlos-music',String(AU.vol)); }catch(e){}
  musicLabel(); sfx('ok');
}
function musicLabel(){ const b=document.getElementById('mus'); if(b) b.textContent='\u266A Sound: '+VOL_NAMES[AU.vol]; }

// ---- sound effects: short synthesized blips, sweeps and noise bursts
function beep(wave,f0,f1,dur,vol,delay){
  const c=AU.ctx, t=c.currentTime+.01+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=wave; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(AU.sfx); o.start(t); o.stop(t+dur+.02);
}
function burst(dur,vol,freq,type,delay){
  const c=AU.ctx, t=c.currentTime+.01+(delay||0), src=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
  src.buffer=AU.noise; src.loop=true; f.type=type||'highpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);

// what each type's attack sounds like as it launches
const ATK_SFX={
  HYPE:   ()=>{ beep('square',220,880,.16,.12); beep('square',330,1320,.16,.07,.03); },
  SNACK:  ()=>{ burst(.05,.16,2500); burst(.05,.16,3000,'highpass',.07); burst(.07,.16,2000,'highpass',.14); },
  CHILL:  ()=>{ beep('sine',700,260,.3,.16); beep('triangle',520,200,.3,.08,.05); },
  REGULAR:()=>{ beep('square',300,200,.09,.11); burst(.06,.1,900,'bandpass',.04); },
  WEIRD:  ()=>{ beep('sawtooth',200,900,.1,.08); beep('sawtooth',900,150,.12,.08,.1); beep('square',1400,400,.08,.05,.2); },
  NERD:   ()=>{ for(let i=0;i<5;i++) beep('square',[1200,1600,900,1800,1400][i],[1200,1600,900,1800,1400][i],.035,.07,i*.045); },
  FANCY:  ()=>{ [1319,1568,2093].forEach((f,i)=>beep('triangle',f,f,.14,.13,i*.06)); },
  SPOOKY: ()=>{ beep('sine',180,520,.22,.14); beep('sine',186,540,.22,.1,.02); beep('sine',520,160,.2,.1,.2); },
};
function sfx(name,arg,delay){
  if(!name||!AU.ctx||AU.ctx.state!=='running'||!AU.vol) return;
  const d=delay||0;
  switch(name){
    case 'move':   beep('square',880,880,.035,.06); break;
    case 'ok':     beep('square',660,660,.05,.08); beep('square',990,990,.07,.08,.05); break;
    case 'back':   beep('square',520,330,.09,.07); break;
    case 'tick':   beep('square',1200,1200,.02,.04); break;
    case 'door':   beep('triangle',300,150,.16,.14); burst(.12,.05,600,'lowpass'); break;
    case 'atk':    (ATK_SFX[arg]||ATK_SFX.REGULAR)(); break;
    case 'hit':    burst(.12,.24,700,'bandpass',d); beep('square',200,70,.12,.14,d); break;
    case 'hitbig': burst(.2,.3,500,'bandpass',d); beep('square',320,50,.22,.18,d); burst(.1,.2,3000,'highpass',d+.06); break;
    case 'hitweak':burst(.07,.12,400,'lowpass',d); beep('triangle',140,90,.08,.14,d); break;
    case 'crit':   beep('square',1568,1568,.05,.09,d); beep('square',2093,2093,.09,.09,d+.05); break;
    case 'miss':   burst(.22,.1,1800,'bandpass'); beep('sine',900,300,.2,.05); break;
    case 'down':   [660,520,390].forEach((f,i)=>beep('square',f,f*.9,.09,.08,i*.09)); break;
    case 'heal':   [523,659,784,1047].forEach((f,i)=>beep('triangle',f,f,.1,.14,i*.07)); break;
    case 'faint':  beep('square',500,60,.5,.12); burst(.25,.08,300,'lowpass',.3); break;
    case 'throw':  beep('sine',300,1100,.28,.1); break;
    case 'shake':  beep('square',180,140,.06,.1); burst(.04,.08,1500); break;
    case 'run':    for(let i=0;i<4;i++) beep('square',500+i*120,500+i*120,.04,.07,i*.06); break;
    case 'bump':   beep('square',110,90,.06,.08); break;
    case 'encounter': {   // the battle-start sting
      burst(.5,.12,800,'bandpass'); beep('sawtooth',180,1400,.45,.06);
      const notes=[523,659,784,1047,1319,1047,1319,1568];
      notes.forEach((f,i)=>{ beep('square',f,f,.06,.07,.05+i*.045); beep('square',f*1.5,f*1.5,.05,.03,.05+i*.045); });
      beep('sawtooth',131,131,.35,.1,.42); beep('square',262,262,.3,.06,.42); burst(.3,.15,300,'lowpass',.42);
      break; }
    case 'send':   burst(.1,.1,2000); beep('square',400,1000,.12,.08,.03); break;
  }
}
window.addEventListener('keydown',e=>{ initAudio(); if(e.key.toLowerCase()==='n'&&!e.repeat) toggleMusic(); });
window.addEventListener('pointerdown',()=>initAudio());
(function(){ const b=document.getElementById('mus'); if(b){ b.addEventListener('click',e=>{ initAudio(); toggleMusic(); b.blur(); }); musicLabel(); } })();

// ------------------------------ LOOP ----------------------------------
function update(){
  frame++; updateMusic();
  if(ui.text&&ui.text.n<999) ui.text.n+=1.3;
  if(banner.t>0) banner.t--;
  if(B){
    for(const k of ['me','foe']){
      const target=B[k].hp, d=target-B.hpS[k];
      B.hpS[k]=Math.abs(d)<.35?target:B.hpS[k]+Math.sign(d)*.35;
    }
  }
  if(scene==='world'){
    if(mv){ mv.t+=held.B?1/5:1/9; if(mv.t>=1){ G.x+=mv.dx; G.y+=mv.dy; mv=null; arrive(); } }
    if(!mv&&!busy&&!ui.menus.length&&!ui.text){
      for(const d of ['up','down','left','right']) if(held[d]){ tryMove(d); break; }
    }
  }
}
let last=0, acc=0;
function loop(ts){
  acc+=Math.min(100,ts-last); last=ts;
  while(acc>=16.6){ update(); acc-=16.6; }
  render();
  requestAnimationFrame(loop);
}
window.CARLOS={ fx, INST, VOICES, playNote, buildSong, KITS, mapLayer, LAYER, AU, SONGS, ENT, WARPS, EXITS, SOLID, BUS, WILD, TIERS, LABELS, makeMon, learnset, get G(){return G;}, get scene(){return scene;}, get busy(){return busy;}, ui, onPress, held, SPECIES, MOVES, MAPS };
requestAnimationFrame(loop);
</script>
